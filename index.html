<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tea Cozy</title>
  </head>
  <body>
    <!--Header section-->

    <header>
      <img src="./images/img-tea-cozy-logo.png" alt="logo image" />
      <nav>
        <ul>
          <li><a href="#">Mission</a></li>
          <li><a href="#">Featured Tea</a></li>
          <li><a href="#">Locations</a></li>
        </ul>
      </nav>
    </header>

    <!--Jumbotron section-->
    <section id="hero">
      <div class="heading-background">
        <h2>Our Mission</h2>
        <h4>
          Handpicked, Artisanally Curated, Free Range, Sustainable, Small Batch,
          Fair Trade, Organic Tea
        </h4>
      </div>
    </section>

    <!--Tea of the month section-->
    <section class="totm">
      <h2>Tea Of The Month</h2>
      <h3>What's Steeping at The Tea Cozy?</h3>
      <!--Flex container Start-->
      <div id="totm-container">
        <div>
          <img src="./images/img-berryblitz.jpg" alt="Fall berry tea" />
          <p>Fall Berry Blitz Tea</p>
        </div>

        <div>
          <img src="./images/img-spiced-rum.jpg" alt="Spiced rum" />
          <p>Spiced Rum Tea</p>
        </div>

        <div>
          <img src="./images/img-donut.jpg" alt="Seasonal Donuts" />
          <p>Seasonal Donuts</p>
        </div>

        <div>
          <img src="./images/img-myrtle-ave.jpg" alt="Myrtle ave tea" />
          <p>Myrtle Ave Tea</p>
        </div>

        <div>
          <img
            src="./images/img-bedford-bizarre.jpg"
            alt="bedford bizarre tea"
          />
          <p>Bedford Bizarre Tea</p>
        </div>
      </div>
      <!--Flex container end-->
    </section>
  </body>
</html>
